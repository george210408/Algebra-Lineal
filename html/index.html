<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Análisis Matricial Pro · Gauss-Jordan</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../css/style.css">
	<script type="module" src="https://unpkg.com/@splinetool/viewer@1.0.28/build/spline-viewer.js"></script>
</head>
<body>
	<div class="spotlight-bg"></div>

	<div class="board">
	  <header class="board__header">
	    <div class="board__title">
	      <span class="board__chalk-mark" aria-hidden="true">∴</span>
	      <div>
	        <h1>Sistemas Lineales</h1>
	        <p>Diagnóstico Automático de Matrices y Herramientas de Álgebra</p>
	      </div>
	    </div>
	  </header>

	  <main class="analysis-container">
	    <!-- SECCIÓN 1: MATRIZ PRINCIPAL -->
	    <section class="input-panel">
	      <h2 style="color: var(--neon-cyan); margin-bottom: 20px; font-family: var(--mono);">Calculadora de Matrices</h2>
	      <div class="config-row">
	        <div class="field">
	          <label>Filas</label>
	          <input type="number" id="rows-in" min="1" max="10" value="3">
	        </div>
	        <div class="field">
	          <label>Columnas</label>
	          <input type="number" id="cols-in" min="1" max="12" value="4">
	        </div>
	        <button id="btn-generate" class="btn btn--accent">Generar Matriz</button>
	      </div>

	      <div id="matrix-wrap" class="matrix-wrap" hidden>
	        <div id="matrix-grid" class="matrix-grid"></div>
	        <button id="btn-analyze" class="btn btn--accent btn-large">🚀 Analizar Matriz</button>
	      </div>
	    </section>

	    <!-- SECCIÓN 2: HERRAMIENTAS ADICIONALES (VECTORES Y BASES) -->
	    <section class="extra-tools-grid">
	      <!-- Herramientas de Vectores -->
	      <div class="tool-card">
	        <h3 style="color: var(--neon-cyan); font-family: var(--mono); margin-top: 0; border-bottom: 1px solid rgba(0, 242, 255, 0.1); padding-bottom: 10px; margin-bottom: 20px;">Vectores Rn</h3>
	        <div class="tool-body" style="display: flex; flex-direction: column; gap: 20px;">
	          <div class="field">
	            <label>Vector U (separado por comas)</label>
	            <input type="text" id="vec-u" placeholder="1, 2, 3" style="width: 100%;">
	          </div>
	          <div class="field">
	            <label>Vector V (separado por comas)</label>
	            <input type="text" id="vec-v" placeholder="4, 5, 6" style="width: 100%;">
	          </div>
	          <div class="btn-row" style="display: flex; gap: 10px; flex-wrap: wrap;">
	            <button class="btn btn--small" data-vec-op="sumar">Suma</button>
	            <button class="btn btn--small" data-vec-op="restar">Resta</button>
	            <button class="btn btn--small" data-vec-op="escalar">k*U</button>
	          </div>
	          <div id="vec-result" class="result-small" hidden style="margin-top: 10px; padding: 12px; background: rgba(0,0,0,0.4); border-radius: var(--radius-sm); border-left: 3px solid var(--neon-purple); color: var(--neon-cyan); font-family: var(--mono); font-weight: 700;">
	            <span class="res-val mono"></span>
	          </div>
	        </div>
	      </div>

	      <!-- Convertidor de Bases -->
	      <div class="tool-card">
	        <h3 style="color: var(--neon-cyan); font-family: var(--mono); margin-top: 0; border-bottom: 1px solid rgba(0, 242, 255, 0.1); padding-bottom: 10px; margin-bottom: 20px;">Convertidor de Bases</h3>
	        <div class="tool-body" style="display: flex; flex-direction: column; gap: 20px;">
	          <div class="field">
	            <label>Número / Base</label>
	            <input type="text" id="conv-in" placeholder="Ej: 1010 o 12" style="width: 100%;">
	          </div>
	          <div class="btn-row" style="display: flex; gap: 10px; flex-wrap: wrap;">
	            <button class="btn btn--small" data-conv="dec-bin">Dec→Bin</button>
	            <button class="btn btn--small" data-conv="bin-dec">Bin→Dec</button>
	            <button class="btn btn--small" data-conv="dec-hex">Dec→Hex</button>
	          </div>
	          <div id="conv-result" class="result-small" hidden style="margin-top: 10px; padding: 12px; background: rgba(0,0,0,0.4); border-radius: var(--radius-sm); border-left: 3px solid var(--neon-purple); color: var(--neon-cyan); font-family: var(--mono); font-weight: 700;">
	            <span class="res-val mono"></span>
	          </div>
	        </div>
	      </div>
	    </section>

	    <!-- SECCIÓN 3: DASHBOARD DE RESULTADOS -->
	    <section id="results-dashboard" class="results-dashboard" hidden>
	      <div class="result-card highlight">
	        <h2 id="res-classification">Clasificación del Sistema</h2>
	        <div id="res-solution" class="solution-body"></div>
	      </div>
	      <div class="results-grid">
	        <div class="result-card">
	          <h3>Proceso de Reducción (Gauss-Jordan)</h3>
	          <div id="res-steps" class="steps-container"></div>
	        </div>
	        <div class="result-card">
	          <h3>Análisis de Inversa</h3>
	          <div id="res-inverse-content"></div>
	        </div>
	      </div>
	    </section>
	  </main>

	  <footer class="board__footer">
	    <p>Sistemas de Ecuaciones Lineales · Análisis Automatizado</p>
	  </footer>
	</div>

	<script src="../js/script.js"></script>
</body>
</html>
